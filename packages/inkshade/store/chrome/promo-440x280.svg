<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
  <title id="title">InkShade promotional tile</title>
  <desc id="desc">A text-free InkShade mark over a browser page changing from light to adaptive dark colors.</desc>
  <defs>
    <linearGradient id="backdrop" x1="30" y1="18" x2="410" y2="266" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171221"/>
      <stop offset="1" stop-color="#37265f"/>
    </linearGradient>
    <linearGradient id="page" x1="72" y1="75" x2="368" y2="226" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8f6fb"/>
      <stop offset=".48" stop-color="#eee9f7"/>
      <stop offset=".52" stop-color="#211c2b"/>
      <stop offset="1" stop-color="#121018"/>
