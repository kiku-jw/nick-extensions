  <title id="title">StudyNav promotional tile</title>
  <desc id="desc">A StudyNav icon beside a simplified reading page with highlights and a local note.</desc>
  <defs>
    <linearGradient id="background" x1="34" y1="20" x2="406" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172438"/>
